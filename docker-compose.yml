services:
  api:
    build:
      context: ./backend
    image: tender-workbench-api
    env_file: .env
    environment:
      TENDER_DATA_DIR: /data
      TENDER_AUTO_CREATE_SCHEMA: "false"
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./backend
    image: tender-workbench-api
    pull_policy: never
    command: ["sh", "-c", ".venv/bin/python -m app.db_bootstrap && exec .venv/bin/python -m app.worker"]
    env_file: .env
    environment:
      TENDER_DATA_DIR: /data
      TENDER_AUTO_CREATE_SCHEMA: "false"
    volumes:
      - ./data:/data
    depends_on:
      - api

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${TENDER_HTTP_PORT:-8088}:80"
    depends_on:
      - api
