[project]
name = "tender-workbench"
version = "2.0.0"
description = "Traceable tender response workbench"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20,<1",
    "alembic>=1.15,<2",
    "cryptography>=45,<50",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "openpyxl>=3.1,<4",
    "pillow>=11,<14",
    "pdfplumber>=0.11.10,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.8,<3",
    "pypdf>=6,<7",
    "pypdfium2>=5,<6",
    "python-docx>=1.2,<2",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy[asyncio]>=2.0.38,<3",
    "uvicorn[standard]>=0.34,<1",
    "opencv-python-headless>=4.10,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP042", "UP047"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
